# Local development only.
# Production: PostgreSQL runs outside Kubernetes (RDS / bare metal), see deploy/k8s.
name: otp

services:
  postgres:
    image: postgres:16
    container_name: otp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-otp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # Extra database created by postgres/init/01-create-databases.sh (used by Keycloak)
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      # Bound to localhost only so it is not exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run only the first time the volume is created.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0}
    container_name: otp-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-otp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-otp_dev_password}
      # EXTERNAL URL: this is what browsers use and what ends up in the token `iss`
      # (http://localhost:8081/realms/otp). Backend reaches Keycloak on the internal
      # http://keycloak:8080 for JWKS only. Full URL => port included in issuer.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Work around OpenJDK 21 SIGILL (SVE trap) on Apple Silicon Linux VMs; no-op on amd64.
      JAVA_OPTS_APPEND: "${JAVA_OPTS_APPEND:--XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0}"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      # Imported only if the realm does not exist yet (use `make reset` to re-import).
      - ./keycloak/realm-otp.json:/opt/keycloak/data/import/realm-otp.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the Keycloak image: probe the management port (9000) with bash /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: ../backend-go
    image: otp-backend:dev
    container_name: otp-backend
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-otp}:${POSTGRES_PASSWORD:-otp_dev_password}@postgres:5432/${POSTGRES_DB:-otp}?sslmode=disable
      # iss must equal the EXTERNAL issuer; keys are fetched from the INTERNAL JWKS URL.
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/${KEYCLOAK_REALM:-otp}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-otp}/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-otp-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Optional debug access, localhost only.
      - "127.0.0.1:${BACKEND_DEBUG_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Distroless/static images have no wget/curl, so no container healthcheck is defined here;
    # readiness is /readyz (used by K8s probes and by the gateway test below).

  frontend:
    build:
      context: ../frontend-react
    image: otp-frontend:dev
    container_name: otp-frontend
    restart: unless-stopped
    environment:
      # Consumed by envsubst to render /config.js at container start.
      KEYCLOAK_AUTHORITY: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/${KEYCLOAK_REALM:-otp}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-otp-web}
      API_BASE_URL: /api

  nginx:
    image: nginx:1.27-alpine
    container_name: otp-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
