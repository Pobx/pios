# Gateway config (Docker Compose). Same file shape is used in K8s (deploy/k8s/nginx.yaml)
# because the upstream names `backend` and `frontend` resolve in both: compose service
# names and K8s Service names.
#
# Routing:
#   /api/ -> backend:8080 (the /api prefix is KEPT, no URI rewriting)
#   /     -> frontend:80
#
# SPA fallback (try_files $uri /index.html) is intentionally NOT done here: the frontend
# container runs its own nginx that serves the static build and does the fallback. The gateway
# stays a pure reverse proxy, so deep links like /organizations work: the gateway forwards
# them to the frontend, which answers with index.html.

# WebSocket-ready: sends "upgrade" only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS (compose). In K8s use kube-dns (see deploy/k8s/nginx.yaml).
# Re-resolving avoids a stale IP after a backend/frontend container is recreated, and lets
# nginx start even when an upstream is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/problem+json application/xml image/svg+xml font/ttf font/otf;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location /api/ {
        # Variable + resolver => upstream resolved at request time. With a variable in
        # proxy_pass and no URI part, the original URI (incl. /api prefix) is passed as is.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
    }
}
