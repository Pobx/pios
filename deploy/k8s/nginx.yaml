# Nginx gateway: routes /api/ -> backend, / -> frontend. Exposed outside the cluster by ingress.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-conf
  namespace: otp
  labels: {app.kubernetes.io/name: nginx, app.kubernetes.io/part-of: otp}
data:
  default.conf: |
    # Gateway config for Kubernetes (embedded in deploy/k8s/nginx.yaml ConfigMap - keep in sync).
    # Differences vs default.conf (compose): listens on 8080 (unprivileged image, non-root),
    # static upstreams (K8s Service ClusterIPs are stable, so no runtime resolver needed),
    # and trusts the Ingress controller for X-Forwarded-Proto/For.
    # Upstream names `backend` / `frontend` are the K8s Service names in the same namespace.
    # SPA fallback is handled by the frontend container, not here.

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Honour the scheme/client IP set by the Ingress controller (TLS terminates there).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream otp_backend  { server backend:8080;  keepalive 16; }
    upstream otp_frontend { server frontend:80;   keepalive 16; }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 10m;
        server_tokens off;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css text/javascript application/javascript application/json
                   application/problem+json application/xml image/svg+xml font/ttf font/otf;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Used by K8s probes of the gateway itself.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://otp_backend;   # no URI part => /api prefix preserved
        }

        location / {
            proxy_pass http://otp_frontend;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: otp
  labels: {app.kubernetes.io/name: nginx, app.kubernetes.io/part-of: otp}
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: nginx}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nginx, app.kubernetes.io/part-of: otp}
      annotations:
        # Bump (or use a hash tool such as Kustomize/Helm) to roll pods when the ConfigMap changes.
        otp/config-revision: "1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /nginx-health, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /nginx-health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap:
            name: nginx-gateway-conf
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: otp
  labels: {app.kubernetes.io/name: nginx, app.kubernetes.io/part-of: otp}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: nginx}
  ports:
    - {name: http, port: 80, targetPort: http}
