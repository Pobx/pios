# TEMPLATE ONLY. All values are placeholders. NEVER commit real credentials.
#
# Create the real secret out-of-band instead of applying this file, e.g.:
#   kubectl -n otp create secret generic otp-db \
#     --from-literal=DB_USER='otp_app' \
#     --from-literal=DB_PASSWORD="$(read -rs p; echo $p)" \
#     --from-literal=DATABASE_URL='postgres://otp_app:<password>@<rds-host>:5432/otp?sslmode=require'
# or use SealedSecrets / External Secrets Operator / SOPS. See README.md.
#
# DATABASE_URL must be URL-encoded if the password contains special characters.
apiVersion: v1
kind: Secret
metadata:
  name: otp-db
  namespace: otp
  labels:
    app.kubernetes.io/part-of: otp
type: Opaque
stringData:
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgres://CHANGE_ME:CHANGE_ME@CHANGE_ME-db-host.example.internal:5432/otp?sslmode=require"
---
# Optional: only needed if a confidential Keycloak client is ever added.
# otp-web is public (PKCE) and otp-api is bearer-only, so no client secret exists today.
apiVersion: v1
kind: Secret
metadata:
  name: otp-keycloak
  namespace: otp
  labels:
    app.kubernetes.io/part-of: otp
type: Opaque
stringData:
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
