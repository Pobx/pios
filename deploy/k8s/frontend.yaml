apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: otp
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: otp}
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: otp}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: registry.example.com/otp/frontend-react:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          env:
            # Rendered into /config.js by the entrypoint (envsubst): no rebuild per environment.
            - {name: KEYCLOAK_AUTHORITY, valueFrom: {configMapKeyRef: {name: otp-config, key: KEYCLOAK_AUTHORITY}}}
            - {name: KEYCLOAK_CLIENT_ID, valueFrom: {configMapKeyRef: {name: otp-config, key: KEYCLOAK_CLIENT_ID}}}
            - {name: API_BASE_URL, valueFrom: {configMapKeyRef: {name: otp-config, key: API_BASE_URL}}}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem is NOT enabled: the entrypoint renders /config.js into
            # /usr/share/nginx/html (next to the built assets) and nginx writes caches/pid
            # files. Making this read-only needs the frontend image to write config.js to a
            # separate writable dir (e.g. /tmp/config) that nginx serves for /config.js.
            # Stock nginx:alpine also starts as root (binds :80), so runAsNonRoot is not set;
            # with nginxinc/nginx-unprivileged (port 8080) set runAsNonRoot: true,
            # readOnlyRootFilesystem: true (+emptyDirs for /tmp, /var/cache/nginx) and change the ports.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: otp
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: otp}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
